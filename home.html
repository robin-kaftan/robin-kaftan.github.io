<!DOCTYPE html>
<html lang="en">

    <head>
        <title>My Portfolio</title>
        <link rel="stylesheet" href="style.css">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="theme-color" content="#ffffff" id="theme-meta">

        <meta property="og:title" content="Robin's Portfolio">
        <meta property="og:description" content="Full of everything I make, love and use. (There are games.)">
        <meta property="og:image" content="https://robin-kaftan.github.io/Resources/thumb.png">
        <meta property="og:url" content="https://robin-kaftan.github.io/">
        <meta property="og:type" content="website">

        <style>
            html,
            body {
                height: 100%;
                overflow-y: auto;
            }
        </style>
    </head>

    <body>
        <div style="grid-column: 1 / -1; padding: 0.25rem;">
            <h1>Home</h1>
            <p>
                This is my new and improved portfolio.<br>
                Check out the <span class="rainbow">Cool 3D Effectz</span> on the left.<br>
                Oh, and also the pages on the left, too.
            </p>
            <p>
                <span class="deltarune-wavy" data-text="Woah, wavy text!?? Haha, I'm not showing off! It's just really cool!">Woah, wavy text!?? Haha, I'm not showing off! It's just really cool!</span><br>
            </p>
        </div>

        <script>
            (function () {
                const savedTheme = localStorage.getItem('portfolio-theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
            })();

            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'SET_THEME') {
                    document.documentElement.setAttribute('data-theme', event.data.theme);
                }
            });
        </script>

        <script src="globalscript.js"></script>
    </body>


</html>
