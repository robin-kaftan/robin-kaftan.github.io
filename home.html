<!DOCTYPE html>
<html lang="en">

    <head>
        <title>My Portfolio</title>
        <link rel="stylesheet" href="style.css">

        <style>
            html,
            body {
                height: 100%;
                overflow-y: auto;
            }
        </style>
    </head>

    <body>
        <div style="grid-column: 1 / -1; padding: 0.25rem;">
            <h1>Home</h1>
            <p>
                This is my new and improved portfolio.<br>
                Check out the <span class="rainbow">Cool 3D Effectz</span> on the left.<br>
                Oh, and also the pages on the left, too.
            </p>
        </div>

        <script>
            (function () {
                const savedTheme = localStorage.getItem('portfolio-theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
            })();

            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'SET_THEME') {
                    document.documentElement.setAttribute('data-theme', event.data.theme);
                }
            });
        </script>
    </body>


</html>
