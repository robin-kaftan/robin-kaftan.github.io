<!DOCTYPE html>
<html lang="en">

    <head>
        <title></title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="favicon.ico">
    </head>

    <body>
        <div class="left-nav">
            <div class="theme-selector-container">
                <select id="theme-selector">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                    <option value="soulless">White</option>
                    <option value="black">Black</option>
                    <option value="lgreen">Light Green</option>
                    <option value="green">Green</option>
                    <option value="tfx">Toby Fox (UT/DR)</option>
                    <option value="bad">Don't Select This One</option>
                </select>
            </div>
            <a onmousemove="tilt(event, this)" onmouseleave="resetTilt(this)" class="left-nav-entry" href="home.html" target="target-display"><img class="emoji" src="./Resources/home.png"><span class="nav-text">Home</span></a>
            <a onmousemove="tilt(event, this)" onmouseleave="resetTilt(this)" class="left-nav-entry" href="assignments.html" target="target-display"><img class="emoji" src="./Resources/projects.png"><span class="nav-text">Assignments</span></a>
            <a onmousemove="tilt(event, this)" onmouseleave="resetTilt(this)" class="left-nav-entry" href="projects.html" target="target-display"><img class="emoji" src="./Resources/assignments.png"><span class="nav-text">Projects</span></a>
            <a onmousemove="tilt(event, this)" onmouseleave="resetTilt(this)" class="left-nav-entry" href="games.html" target="target-display"><img class="emoji" src="./Resources/games.png"><span class="nav-text">Games</span></a>
        </div>

        <div class="iframe-container">
            <iframe scrolling="auto" class="center-iframe" id="portfolio-iframe" name="target-display" src="home.html"></iframe>
        </div>

        <div class="right-news">
            <div class="news-entry">
                <p class="news-desc">
                    5/08/26<br>DigiTech assignment available at the Assignments page. <a class="hyperlink" href="assignments.html" target="target-display">Go to it?</a>
                </p>
            </div>
        </div>

        <script>
            function tilt(e, el, z = 25) { const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 2 - 1, y = (e.clientY - r.top) / r.height * 2 - 1; if (el.parentElement && window.getComputedStyle(el.parentElement).transformStyle !== 'preserve-3d') el.parentElement.style.transformStyle = 'preserve-3d'; el.style.willChange = 'transform,filter'; el.style.backfaceVisibility = 'hidden'; el.style.transform = `perspective(1000px) scale(1.02) rotateX(${-y * 12}deg) rotateY(${x * 12}deg) translateZ(${z}px) translate3d(0,0,0)`; el.style.filter = 'drop-shadow(0px 12px 24px rgba(0,0,0,0.05))'; el.style.transition = 'transform 0.3s cubic-bezier(0.25,1,0.5,1),filter 0.3s cubic-bezier(0.25,1,0.5,1)'; } function resetTilt(el) { el.style.transform = 'perspective(1000px) scale(1) rotateX(0deg) rotateY(0deg) translateZ(0px) translate3d(0,0,0)'; el.style.filter = 'drop-shadow(0px 2px 4px rgba(0,0,0,0.05))'; el.style.transition = 'transform 0.4s cubic-bezier(0.25,1,0.5,1),filter 0.4s cubic-bezier(0.25,1,0.5,1)'; setTimeout(() => { if (el.style.transform.includes('scale(1)')) { el.style.willChange = 'auto'; } }, 400); }
        </script>

        <script>
            document.addEventListener('DOMContentLoaded', () => { const selector = document.getElementById('theme-selector'); const iframe = document.getElementById('portfolio-iframe'); function loadPage(url) { if (iframe) { try { iframe.contentWindow.location.replace(url); } catch (e) { iframe.src = url; } } } function updateIframeFromUrl() { const params = new URLSearchParams(window.location.search); const pageParam = params.get('page') || 'home.html'; loadPage(pageParam); } updateIframeFromUrl(); window.addEventListener('popstate', updateIframeFromUrl); document.body.addEventListener('click', (e) => { const link = e.target.closest('a[target="target-display"]'); if (link && iframe) { e.preventDefault(); const targetPage = link.getAttribute('href'); loadPage(targetPage); const newUrl = window.location.pathname + '?page=' + encodeURIComponent(targetPage); history.pushState(null, '', newUrl); } }); function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme); if (selector) selector.value = theme; localStorage.setItem('portfolio-theme', theme); if (iframe && iframe.contentWindow) { iframe.contentWindow.postMessage({ type: 'SET_THEME', theme: theme }, '*'); } } if (selector) { selector.addEventListener('change', (e) => { applyTheme(e.target.value); }); } const savedTheme = localStorage.getItem('portfolio-theme') || 'light'; applyTheme(savedTheme); if (iframe) { iframe.addEventListener('load', () => { const currentTheme = localStorage.getItem('portfolio-theme') || 'light'; applyTheme(currentTheme); setTimeout(() => { iframe.style.opacity = '1'; }, 10); }); } });
        </script>

        <script>
            const config = { phrases: ["My Portfolio", "Robin's Portfolio", "Cool Portfolio", "Robin's Website", "My Portfolio Site", "Sandysite"], minTypeSpeed: 50, maxTypeSpeed: 250, backspaceSpeed: 75, holdTime: 2500, typoChance: .1, typoHoldTime: 300, cursorBlinkSpeed: 500, cursorChar: "│" }; const nearbyKeys = { a: "qwsz", b: "vghn", c: "xdfv", d: "ersfxc", e: "wsdr", f: "rtgvcd", g: "tyhbvf", h: "yujnbg", i: "ujko", j: "uikmnh", k: "ijlm", l: "okp", m: "njk", n: "bhjm", o: "iklp", p: "ol", q: "wa", r: "edft", s: "wedvza", t: "rfgy", u: "yhji", v: "cfgb", w: "qase", x: "zsdc", y: "tghu", z: "asx" }; let phraseIndex = 0, currentText = "", showCursor = !0; const updateTitle = () => { let e = currentText; showCursor && (e += config.cursorChar), document.title = e.trim() || config.cursorChar || "\u00A0" }; setInterval(() => { showCursor = !showCursor, updateTitle() }, config.cursorBlinkSpeed); const getRandomDelay = (e, t) => Math.floor(Math.random() * (t - e + 1)) + e; function getTypoCharacter(e) { const t = e.toLowerCase(); return nearbyKeys[t] ? nearbyKeys[t][Math.floor(Math.random() * nearbyKeys[t].length)] : String.fromCharCode(e.charCodeAt(0) + 1) } async function startTypingSystem() { const e = t => new Promise(e => setTimeout(e, t)); while (!0) { const t = config.phrases[phraseIndex]; for (let r = 0; r <= t.length; r++) { if (r < t.length && Math.random() < config.typoChance) { const o = getTypoCharacter(t[r]); currentText = t.slice(0, r) + o, updateTitle(), await e(config.typoHoldTime) } currentText = t.slice(0, r), updateTitle(), await e(getRandomDelay(config.minTypeSpeed, config.maxTypeSpeed)) } await e(config.holdTime); for (let r = t.length; r >= 0; r--)currentText = t.slice(0, r), updateTitle(), await e(config.backspaceSpeed); phraseIndex = (phraseIndex + 1) % config.phrases.length, await e(500) } } startTypingSystem();
        </script>

    </body>

</html>
