<!DOCTYPE html>
<html lang="en">

    <head>
        <link rel="stylesheet" href="style.css">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="theme-color" content="#ffffff" id="theme-meta">

        <meta property="og:title" content="Robin's Portfolio">
        <meta property="og:description" content="Full of everything I make, love and use. (There are games.)">
        <meta property="og:image" content="https://robin-kaftan.github.io/Resources/thumb.png">
        <meta property="og:url" content="https://robin-kaftan.github.io/">
        <meta property="og:type" content="website">

        <style>
            html,
            body {
                height: 100%;
                overflow-y: auto;
            }
        </style>
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <style>
            @font-face {
                font-family: '8BitOperator';
                font-weight: bold;
                font-display: block;
                src: url('./Fonts/8bitOperatorPlus-Bold.ttf') format('truetype');
            }

            @font-face {
                font-family: '8BitOperator';
                font-weight: normal;
                font-display: block;
                src: url('./Fonts/8bitOperatorPlus-Regular.ttf') format('truetype');
            }

            body {
                visibility: hidden;
            }
        </style>
        <script>let themeResolved; const themePromise = new Promise(r => { themeResolved = r; }); Promise.all([new Promise(r => document.addEventListener('DOMContentLoaded', r)), document.fonts.ready, themePromise]).then(() => { document.body.style.visibility = 'visible'; }); window.addEventListener('message', e => { if (e.data && e.data.type === 'SET_THEME') { document.documentElement.setAttribute('data-theme', e.data.theme); themeResolved(); } }); window.parent.postMessage({ type: 'REQUEST_THEME' }, '*');</script>
    </head>

    <body>
        <div style="grid-column: 1 / -1; padding: 0.25rem;">
            <h1>Games</h1>
            <p>They're educational, I swear!</p><br>
            <input class="search-input" id="searchInput" type="text" placeholder="Search Name...">
            <hr>
            <div class="container" id="gameContainer">
                <button class="game-card" onclick="window.location.href='./Games/Minecraft8/index.html'">
                    <img class="gameImage" src="./Resources/eag.png"><br> Minecraft 1.8
                </button>
                <button class="game-card" onclick="window.location.href='./Games/Minecraft12/index.html'">
                    <img class="gameImage" src="./Resources/eag.png"><br> Minecraft 1.12
                </button>
                <button class="game-card" onclick="window.location.href='./Games/SlopePlus/index.html'">
                    <img class="gameImage" src="./Resources/slope.png"><br> Slope
                </button>
                <button class="game-card" onclick="window.location.href='./Games/PaperMC/index.html'">
                    <img class="gameImage" src="./Resources/papermc.png"><br> Paper Minecraft
                </button>
            </div>

            <script>
                const searchInput = document.getElementById('searchInput');
                const gameButtons = document.querySelectorAll('#gameContainer .game-card');

                searchInput.addEventListener('input', () => {
                    const query = searchInput.value.toLowerCase().trim();

                    gameButtons.forEach(button => {
                        // Use innerText or target specific text nodes to avoid grabbing unwanted element text
                        const gameText = button.innerText.toLowerCase();
                        const matches = gameText.includes(query);

                        // Use '' to respect original CSS display style instead of forcing inline-block
                        button.style.display = matches ? '' : 'none';
                    });
                });
            </script>

        </div>

        <script>
            (function () {
                const savedTheme = localStorage.getItem('portfolio-theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
            })();

            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'SET_THEME') {
                    document.documentElement.setAttribute('data-theme', event.data.theme);
                }
            });
        </script>
    </body>

</html>
