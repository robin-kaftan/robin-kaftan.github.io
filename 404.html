<!DOCTYPE html>
<html lang="en">

    <head>
        <link rel="stylesheet" href="style.css">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="theme-color" content="#ffffff" id="theme-meta">

        <meta property="og:title" content="Robin's Portfolio">
        <meta property="og:description" content="Full of everything I make, love and use. (There are games.)">
        <meta property="og:image" content="https://robin-kaftan.github.io/Resources/thumb.png">
        <meta property="og:url" content="https://robin-kaftan.github.io/">
        <meta property="og:type" content="website">
    </head>

    <body style="background:#020202;display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; width: 100%; text-align: center;">
        <h1 style="color: #010101; margin: 0;" class="bitoperator">It's so dark, I.. I cant see anything!</h1>
        <h1 style="color: #010101; margin: 0;" class="bitoperator">H-Hello? Anyone!? Is anyone there!?</h1>
        <script>
            (function () {
                const savedTheme = localStorage.getItem('portfolio-theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
            })();

            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'SET_THEME') {
                    document.documentElement.setAttribute('data-theme', event.data.theme);
                }
            });
        </script>
    </body>

</html>
