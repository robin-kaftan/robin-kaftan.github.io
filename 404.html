<!DOCTYPE html>
<html lang="en">

    <head>
        <link rel="stylesheet" href="style.css">
    </head>

    <body style="background:#020202;display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; width: 100%; text-align: center;">
        <h1 style="color: #010101; margin: 0;" class="bitoperator">It's so dark, I.. I cant see anything!</h1>
        <h1 style="color: #010101; margin: 0;" class="bitoperator">H-Hello? Anyone!? Is anyone there!?</h1>
        <script>
            (function () {
                const savedTheme = localStorage.getItem('portfolio-theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
            })();

            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'SET_THEME') {
                    document.documentElement.setAttribute('data-theme', event.data.theme);
                }
            });
        </script>
    </body>

</html>
