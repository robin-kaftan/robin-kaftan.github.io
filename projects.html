<!DOCTYPE html>
<html lang="en">

    <head>
        <link rel="stylesheet" href="style.css">

        <style>
            html,
            body {
                height: 100%;
                overflow-y: auto;
            }
        </style>
    </head>

    <body>
        <div style="grid-column: 1 / -1; padding: 0.25rem;">
            <h1>Projects</h1>

            <h1 style="width: fit-content;">testing zoan</h1>
            <button onclick="document.getElementById('linkernweb').toggleAttribute('hidden')">Show/Hide</button>
            <div style="grid-column: 1 / -1; padding: 0.25rem;" hidden id="linkernweb">
                <h1>hi</h1>
            </div>
            <script>
                (function () {
                    const savedTheme = localStorage.getItem('portfolio-theme') || 'light';
                    document.documentElement.setAttribute('data-theme', savedTheme);
                })();

                window.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'SET_THEME') {
                        document.documentElement.setAttribute('data-theme', event.data.theme);
                    }
                });
            </script>
    </body>

</html>
